<!doctype html><html lang="ja"><meta charset="utf-8"><title>tactics 音源 v2 技術確認・試聴</title><style>body{background:#14252a;color:#e4ebdf;max-width:960px;margin:40px auto;padding:0 24px;font:16px/1.7 system-ui}button,select,input{font:inherit;margin:8px;padding:8px}button{cursor:pointer}pre{white-space:pre-wrap;background:#21383c;padding:16px}a{color:#c2e2c0}label{display:inline-block}audio{width:100%}</style><h1>澪を継ぐ者 — BGM / SE v2</h1><p>技術検証用の独立画面。進行・セーブへのアクセスはありません。開始操作後に音を再生します。処理成功は聴感品質・3周の自然さを保証しません。</p><button id="verify">35音源を検証して順に短く再生</button><button id="stop">停止</button><pre id="report">未実施</pre><details><summary>技術検証ログ</summary><pre id="log"></pre></details><label>曲・SE <select id="cue"></select></label><button id="play">選択音源を再生</button><button id="mute">ミュート切替</button><p><label>BGM音量 <input id="bgm" type="range" min="0" max="100" value="50"></label><label>SE音量 <input id="se" type="range" min="0" max="100" value="65"></label></p><pre id="state"></pre><h2>各20秒の試聴サンプル</h2><div id="previews"></div><p><a href="./tactics-bgm-v2-three-previews.zip">試聴3曲ZIP</a> ／ <a href="./README.md">制作・検証記録</a></p><h2>全35音源の一覧（BGM改訂2）</h2><table><thead><tr><th>曲名・SE名</th><th>使用画面・発火</th><th>曲調</th></tr></thead><tbody id="all-cues"></tbody></table>
<script type="module">
import {GameAudio} from '/src/audio.ts';
import {AUDIO_CATALOG,MUSIC_IDS,SOUND_IDS} from '/src/audio-cues.ts';
const $=id=>document.getElementById(id);let context,armed,started=[],generation=0;
const audio=new GameAudio(status=>{$('state').textContent=JSON.stringify(status,null,2)},{createContext:()=>{
 context=new AudioContext();const create=context.createBufferSource.bind(context);
 context.createBufferSource=()=>{const s=create(),start=s.start.bind(s);s.start=(...args)=>{start(...args);started.push({id:armed,loop:s.loop,duration:s.buffer.duration,time:context.currentTime})};return s};return context;
}});
for(const id of [...MUSIC_IDS,...SOUND_IDS]){$('cue').add(new Option(id,id))}
fetch('./metadata.json', {cache:'no-store'}).then(r=>r.json()).then(meta=>{for(const cue of meta.cues){const option=[...$('cue').options].find(o=>o.value===cue.id);if(option)option.textContent=cue.title+' ('+cue.id+')';const row=document.createElement('tr'),name=document.createElement('td'),usage=document.createElement('td'),tone=document.createElement('td'),link=document.createElement('a');link.href=AUDIO_CATALOG[cue.id];link.textContent=cue.title;name.append(link);usage.textContent=cue.usage;tone.textContent=cue.direction??'—';row.append(name,usage,tone);$('all-cues').append(row)}});
for(const id of ['title','prologue','b12']){const label=document.createElement('p');label.textContent=({title:'タイトル：岸を越える地図',prologue:'序章：二年前の薄明',b12:'B12：誰の堤か'})[id];const el=document.createElement('audio');el.controls=true;el.preload='none';el.src=`./short-previews/tactics-${id}-preview-20s.wav`;$('previews').append(label,el)}
$('bgm').oninput=()=>audio.setVolumes({bgm:Number($('bgm').value)/100});$('se').oninput=()=>audio.setVolumes({se:Number($('se').value)/100});$('mute').onclick=()=>audio.setMuted(!audio.status.muted);
$('stop').onclick=()=>{generation++;audio.beginScene(null)};
$('play').onclick=async()=>{generation++;audio.beginScene(null);await audio.enable();audio.setMuted(false);armed=$('cue').value;if(armed.startsWith('bgm'))audio.beginScene(armed);else audio.playSE(armed)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('verify').onclick=async()=>{
 const token=++generation;$('verify').disabled=true;started=[];
 try{audio.beginScene(null);await audio.enable();audio.setMuted(false);if(audio.status.contextState!=='running')throw Error('AudioContext not running');
 const meta=await fetch('./metadata.json', {cache:'no-store'}).then(r=>r.json());let count=0;
 for(const cue of meta.cues){if(generation!==token)throw Error('停止');armed=cue.id;
 const response=await fetch(AUDIO_CATALOG[cue.id], {cache:'no-store'});if(!response.ok)throw Error(cue.id+' HTTP '+response.status);
 const bytes=await response.arrayBuffer();const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');
 if(hash!==cue.delivery.sha256)throw Error(cue.id+' SHA mismatch');
 const decoded=await context.decodeAudioData(bytes.slice(0));if(Math.abs(decoded.duration-cue.delivery.seconds)>.02||decoded.numberOfChannels!==2)throw Error(cue.id+' decode mismatch');
 const before=started.length;audio.beginScene(cue.id.startsWith('bgm')?cue.id:null);if(cue.id.startsWith('se'))audio.playSE(cue.id);
 for(let n=0;n<150&&started.length===before;n++)await wait(50);
 if(started.length===before)throw Error(cue.id+' source did not start');
 if(cue.id.startsWith('bgm')&&!started.at(-1).loop)throw Error(cue.id+' loop flag missing');
 count++;$('report').textContent=`${count}/35 HTTP・SHA・WebAudioデコード・Source開始を確認\n`+JSON.stringify(started.at(-1));await wait(350);
 }
 audio.beginScene(null);$('report').textContent='完了 35/35\nHTTP・SHA256一致・WebAudio再デコード・Source開始を確認。BGM16曲 loop=true。\n各音源の再生は冒頭約0.35秒のみ。全尺・音色・3周の聴感は未検証。';$('log').textContent=JSON.stringify(started,null,2);
 }catch(error){$('report').textContent='未完了: '+error.message}finally{$('verify').disabled=false}
};
</script></html>
